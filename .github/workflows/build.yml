name: Build and push mcp_proxy

on:
  push:
    branches: [main, multiserver-test]
  schedule:
    # Rebuild semanal (lunes 06:00 UTC) para arrastrar automáticamente
    # cualquier actualización de crowdsecurity/crowdsec:latest, incluso
    # sin cambios en este repo. Solo aplica a main.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tag según la rama
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (sin cache, pull de imágenes base)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/carlos-uy/mcp_proxy:${{ steps.tag.outputs.tag }}
            ghcr.io/carlos-uy/mcp_proxy:${{ github.sha }}
